# ============================================================
#  AIOps 数据采集 SDK · 打包元数据（task.md T7 细节 8）
#
#  分发名   : aiops-observed-sdk   （`pip install -e .` 用的名字）
#  导入名   : sdk                  （源码在 src/sdk/，与 task.md T7 细节 1 一致）
#
#  ★ 为什么不把分发名也叫 `sdk`：
#    顶层包名 `sdk` 太通用，真发布到索引上会与别人冲突；
#    而**导入名**在项目内已经写死为 `sdk`（`python -m sdk run`），
#    所以这里用"分发名 ≠ 导入名"这一对标准写法：
#      [project].name  = aiops-observed-sdk
#      packages        = ["sdk", ...]
#
#  ★ 依赖只用**已经装好**的那些（requirements-services.txt），
#    不引入新包：本项目要在离线环境里可复现（spec §2 H9）。
# ============================================================

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-observed-sdk"
version = "0.2.0"
description = "AIOps 被观测系统的数据采集 SDK：零代码改动接入（配置驱动 + 自动埋点）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# 运行期依赖：容器/服务端已有的那套，不新增
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "jsonschema==4.26.0",  # Platform validates registered OpenAPI request schemas.
    "asyncpg",
    "prometheus-client",
    "structlog",
    "tzdata; sys_platform == 'win32'",  # IANA day boundaries for command time filters.
]

[project.optional-dependencies]
# 链路采集需要 OTel 那一套（T10）；单独列出来，便于"只要指标日志"的接入方少装东西
tracing = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
]

[project.scripts]
# 装了包之后可以直接 `aiops-sdk run --config ...`（等价于 python -m sdk run）
aiops-sdk = "sdk.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sdk", "sdk.adapters", "diagnostics"]

[tool.setuptools.package-data]
diagnostics = ["*.json"]
