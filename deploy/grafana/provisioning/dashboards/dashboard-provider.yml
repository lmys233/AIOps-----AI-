# ============================================================
#  Grafana 仪表盘自动装载
# ============================================================

apiVersion: 1

providers:
  - name: AIOps
    orgId: 1
    folder: AIOps
    folderUid: aiops
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
