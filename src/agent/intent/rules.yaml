# ==================================================================
#  意图识别的**规则表**（spec §3.1「规则前置」）
#
#  ★ 为什么规则放文件、不放代码：
#    这张表是**数据**（命中什么词算多少分），会随真实语句不断增补；
#    而"谁优先、怎么去重、兜底怎么定"是**语义/红线**，必须留在代码里。
#    混在一起时，每次加一个同义词都要改 .py、过一遍 review —— 于是没人愿意加。
#
#  ★ 三条读这张表必须知道的规则（校验器会强制其中一部分）：
#
#    1. **顺序即优先级**：`rules` 里的先后就是匹配顺序，先过 gate 者胜。
#       ★ 这不是可读性偏好，而是 MECE 的实现方式（见 rules.py 的注释）。
#    2. **weight 是"证据强度"，不是概率**：分数 = 命中权重和 ÷ 2.0（饱和值），
#       同一段文字只计一次（重叠去重）。所以强模式要写在弱模式**前面**。
#    3. **gate 是"采信门槛"**：该规则得分低于 gate 就算没命中，继续往下走。
#
#  ★ 红线（改这张表时不要碰，校验器会拦）：
#    · `REMEDIATION` 规则必须存在，且至少有一条强模式（weight ≥ 1.0）
#      —— spec §2 H6：写能力只能由 REMEDIATION 解锁，不能让模型把它翻成只读
#    · 兜底分必须**低于所有 gate**（语义序：兜底永远是"证据最弱"那一档）
#    · 兜底分不得达到决策阈值 0.70
#
#  ★ 「高危命中即定案」：REMEDIATION 只要过了自己的 gate 就直接定案，
#    **不再比分数阈值、不交给模型**（见 rules.py 的 is_decided_by_rules）。
#    所以那张"命中即锁定"的事靠的是判定逻辑，不是靠把 gate 抬高 ——
#    抬高 gate 只会让"回滚一下"这类弱写信号掉进兜底（变成礼貌拒答），那更糟。
#
#  ★ 增词的门槛：加词前问一句"这句话**没有**这个词时，还能不能判对？"
#    只有"不加就会判错"的词才值得加 —— 否则词表会变成谁都不敢删的垃圾场。
# ==================================================================

version: 1

# ---- 互斥判据（数据，不是代码）---------------------------------------
#  ★ 这里的正则是「祈使式写动作」的**唯一定义处**（审核 #19：以前 Python 与
#    YAML 各写一份，只往 YAML 加动词就会与下面 KNOWLEDGE_QA 的互斥判定静默漂移）。
#  用法：某条 KNOWLEDGE_QA 规则先命中了，但整句又能被它匹配上 → 说明用户在
#  "问流程"而不是"要动手"，于是跳过那条知识型规则往下判（rules.py 的 `_decide`）。
#  R2_write 的第一条 pattern 与本条应当保持同形（同一个动作词表），但**语义不同**：
#  那条是"给写意图加分"，这条是"排除知识型误判"，所以各留一份、只此一处。
mutex:
  imperative_write: '(把|将|给|帮我|请|立即|马上|立刻|执行)[^，。；]{0,16}(重启|回滚|扩容|缩容|发布|上线|下线|删除|停掉|摘除|禁用)'

rules:

  # 具体服务 + 故障症状 + 求建议优先；不以「要求执行」作为处置唯一入口。
  # 作用域只使用真实服务槽位和症状，抽象知识须有明确故障陈述才能覆盖。
  - id: R0_incident_advice
    intent: REMEDIATION
    gate: 0.50
    scope:
      kind: service_fault
      abstract: '原理|概念|定义|规范|最佳实践|SOP|通用|一般|通常|预防'
      assertion: '发生|检测到|出现|报错|失败|已满|满了|被拒绝|存在问题|有问题|异常|故障|告警'
    patterns:
      - pattern: '(解决|修复|处理|恢复|处置)[^，。；？?\n]{0,40}(方法|办法|方案|建议|措施|步骤|流程|手册|指南|最佳实践)'
        weight: 1.4
        note: "具体故障求处置方法；可含操作流程/手册，不代表执行授权"
      - pattern: '(给出|提供|给我|有哪些|有什么)[^，。；？?\n]{0,32}(修复|解决|处置|处理|恢复)(方法|办法|方案|建议|步骤|流程|手册|指南|最佳实践)'
        weight: 1.4
        note: "给具体服务故障提供处置建议"
      - pattern: '(怎么|如何|怎样)(解决|修复|处理|恢复|处置)'
        weight: 1.4
        note: "有具体服务与症状的处置追问优先于知识词"
      - pattern: 'how to (fix|resolve|handle)|remediation (plan|steps)'
        weight: 1.6
        note: "具体服务中断故障的英文处置诉求"

  # ---- R1 知识型问句 -------------------------------------------------
  #  ★ 必须排在写动作规则**之前**：否则"我们的扩容流程是什么"里的"扩容"
  #    会被当成写请求。真正的互斥判据是"有没有祈使结构"
  #    （见 rules.yaml 顶部的 `mutex.imperative_write`），这里只负责先把知识型的意图证据攒够。
  - id: R1_knowledge
    intent: KNOWLEDGE_QA
    gate: 0.60
    patterns:
      - pattern: '(what is|definition of)[^？?\n]{0,32}(cancellation|disconnect|deadline|lock wait)'
        weight: 1.5
        note: "英文中断/等待概念解释"
      - pattern: '(什么是[^，。；？?\n]{0,24}(死锁|超时|连接池|线程池|请求取消|客户端断开|锁等待|取消率|超时率|deadline))|((死锁|超时|连接池|线程池|请求取消|客户端断开|锁等待|取消率|超时率|deadline)(的(含义|定义|概念))?是什么)'
        weight: 1.5
        note: "概念解释；没有处置诉求时保持知识问答"
      - pattern: '(通用|一般|通常)[^，。；？?\n]{0,32}(处理|解决|修复)[^，。；？?\n]{0,16}(方法|办法)'
        weight: 1.5
        note: "抽象通用方法；具体已发生故障已由前置作用域规则识别"
      - pattern: '流程|规范|SOP|标准操作|最佳实践|指南|文档|手册'
        weight: 1.2
        note: "问流程/规范 —— 最强证据"
      - pattern: '复盘'
        weight: 0.8
        note: "故障复盘属流程类问题"
      - pattern: '怎么(做|办)|如何(做|排查|处理)|步骤'
        weight: 0.8
        note: "询问做法"
      - pattern: '是什么|有哪些'
        weight: 0.3
        note: "弱词：单独出现不足以判定知识型，只作辅助"

  # ---- R2 写动作（高危：命中即定案）---------------------------------
  #  ★ gate = 0.50：弱写信号（"回滚一下" = 1.0/2）也要能被规则层抓住，
  #    否则它会掉进兜底变成"礼貌拒答" —— 用户明明是要动生产。
  #    "命中即定案、不给模型翻盘"由 is_decided_by_rules() 保证，不靠抬高 gate。
  - id: R2_write
    intent: REMEDIATION
    gate: 0.50
    patterns:
      # [^，。；]{0,16} 而不是 \S{0,16}：要允许"把 order 服务重启一下"里的空格，
      # 但必须在标点处停下（否则"把 A 重启，再查 B 的影响"会跨句匹配）
      - pattern: '(把|将|给|帮我|请|立即|马上|立刻|执行)[^，。；]{0,16}(重启|回滚|扩容|缩容|发布|上线|下线|删除|停掉|摘除|禁用)'
        weight: 1.4
        note: "祈使式写动作 —— 最强证据（有对象、有动作）"
      - pattern: '(重启|回滚|扩容|缩容|发布|上线|下线|删除|停掉|摘除|禁用)一下'
        weight: 1.0
        note: "『…一下』也是祈使语气"
      # ★★ T43：**"怎么解决 / 如何修复"同样是处置诉求** —— 用户已经知道原因，要的是"怎么办"。
      #   实测：诊断完 inventory 的故障后追问「怎么解决？」，原来没有这条 → 落兜底 → 反问目标，
      #   而目标（inventory）就在上一轮里。P1 不执行写动作，只出**预案 + 风险分级**（spec §3.4）。
      - pattern: '(怎么|如何|怎样)(解决|修复|处理|恢复|搞定)|解决(方案|办法)|处置(方案|建议)|修复方案'
        weight: 1.0
        note: "问怎么办（处置诉求；P1 只给预案与风险分级，不执行）"
      # ★ L4 类动作单独给一条**强模式**（T21）：`删命名空间 / 改 RBAC / 改网络策略 /
      #   操作控制面 / 删 PVC / 跨命名空间` 这类说法哪怕不带祈使前缀也必须判成写意图 ——
      #   否则它会掉进兜底（变成"越界/听不懂"），而**分级与 L4 拒绝链根本走不到**。
      #   方向是安全的：判成写意图只会让它更快被 L4 闸门拒掉（spec §3.4）。
      #   ★ 必须写在"裸动作词"**之前**：重叠去重保留先出现的那条，
      #     写在后面会被裸动作词（0.6）顶掉 → 0.30 < gate 0.50 → 整条规则不命中（实测踩到）。
      - pattern: '(删|删除|移除|改|修改|变更|调整)[^，。；]{0,10}(命名空间|rbac|网络策略|控制面|pvc|跨命名空间)'
        weight: 1.4
        note: "L4 禁止类动作（spec §3.4）：必须被识别为写意图，才能走 L4 拒绝"
      - pattern: '(重启|回滚|扩容|缩容|发布|上线|下线|删除|停掉|摘除|禁用)'
        weight: 0.6
        note: "裸动作词（弱证据）：『重启记录』『回滚历史』里也有，不能单独定案"

  # ---- R3 变更影响 ---------------------------------------------------
  - id: R3_change_impact
    intent: CHANGE_IMPACT
    gate: 0.60
    patterns:
      - pattern: '(影响|波及|爆炸半径|关联)(了|到)?(哪些|什么|多少)'
        weight: 1.0
        note: "问波及范围"
      - pattern: '能不能(发|上线|发布)|(发|上线)了会'
        weight: 1.0
        note: "发布前的风险评估"
      - pattern: '(变更|发布|上线|改动|配置|configmap|镜像|版本)(记录|列表|历史)'
        weight: 0.8
        note: "查变更清单"
      - pattern: '(变更|发布|上线|改动|回滚)'
        weight: 0.4
        note: "弱词：提到变更不等于问影响"

  # ---- R4 异常定位 ---------------------------------------------------
  - id: R4_interruption_metric
    intent: METRIC_QUERY
    gate: 0.50
    patterns:
      - pattern: '^(?!.*(?:原因|排查|定位|诊断|为什么|异常|故障|解决|修复|处理|why|diagnos|investigat)).*(取消率|超时率|取消次数|超时次数|cancellation rate|timeout rate)[^，。；\n]{0,16}(多少|数值|how many|value)'
        weight: 1.6
        note: "明确查中断指标数值；不覆盖排查或方案诉求"
  - id: R4_request_interruption_diagnose
    intent: INCIDENT_RCA
    gate: 0.50
    scope:
      kind: service_fault
      abstract: '原理|概念|定义|规范|最佳实践|SOP|通用|一般|通常|预防'
      assertion: '发生|出现|检测到|已经|被取消|断开|期限到达|锁等待|异常|故障|cancelled|canceled|disconnect'
    patterns:
      - pattern: '(请求.{0,3}取消|客户端.{0,3}断开|连接.{0,3}断开|期限到达|超过期限|锁等待|等锁|停机取消|cancellation|cancelled|canceled|disconnect|deadline|lock wait)'
        weight: 0.6
        note: "中断/等待症状；单独一个术语不定案"
      - pattern: '排查|定位|原因|为什么|检查|诊断|diagnos|investigat|why'
        weight: 1.0
        note: "具体服务的排查诉求，与症状共同定案"
  #  gate 放宽到 0.40：**一个强异常词（0.8/2）就够叫故障**
  - id: R4_incident
    intent: INCIDENT_RCA
    gate: 0.40
    patterns:
      - pattern: '根因|原因|为什么|定位|排查|归因|怎么回事'
        weight: 1.0
        note: "明确要求定位原因"
      - pattern: '延迟|耗时|P99|P95|错误率|失败率|超时|报错|失败|不可用|雪崩|抖动|毛刺|死锁|deadlock|DB_DEADLOCK|THREAD_POOL_REJECTED|已满|满了|被拒绝'
        weight: 0.8
        note: "异常信号词"
      # ★★ BUG-251 修：上面那条**认不出疑问式**的说法 —— 实测「payment 报了什么错？」
      #    不含子串「报错」，规则层直接落兜底（0.20），于是全靠模型临场判：
      #    同一句话两次跑出 INCIDENT_RCA / METRIC_QUERY 两种结果（不稳定）。
      #    "报了什么错 / 错误类型 / 哪些错误 / 正常吗" 问的都是**要不要判异常**，
      #    答案形状是"结论或如实拒答"，必须由**确定性规则**定案（不赌模型）。
      - pattern: '报了什么错|报了什么|有什么错|哪些错|错误类型|出错|什么异常|哪里错|报错了吗|正常吗|是否正常|有没有\s*(?:(?:出现|发生|存在)\s*)?(?:(?:什么|啥|任何)\s*)?(?:问题|异常|故障)|有(?:什么|啥|哪些)(?:问题|异常|故障)|有无(?:任何)?(?:问题|异常|故障)|异常吗|是否存在问题|是否有问题|有问题吗|是否存在异常|是否异常|是否故障|是否有故障|是否可用|是否健康|健康吗|什么情况|状态如何|状态怎么样|没问题吧'
        weight: 1.5
        note: "★ 权重 1.5：分数口径是 `Σ权重/2.0`，1.5 → 0.75 ≥ `RULE_DECIDE_THRESHOLD`，
              于是这类措辞由**规则定案**（不再赌模型临场判）"
        note: "疑问式的异常/错误询问（要求判异常，不是要一个数）"
      # ★★ 契约修订 21：**「<指标> 有问题/是否正常」也算异常信号** ——
      #   "QPS 最近有问题，服务是不是有问题"必须判成异常定位（给结论/如实拒答），
      #   而不是"查数值"（给一个数）：两类问法的答案形状不同，路由错了两边都给不好。
      #   ★ 必须**锚在指标/技术名词上**：光有"有问题"不算（"最近是否有问题？"是一句
      #     缺目标的健康询问，它的正确处置是**反问目标**，不是直接当故障排查）。
      #   ★ 间隔限死（≤6 字且**不跨行/不跨句**）：否则"上下文编织"把上一轮的
      #     「有问题」拼进来时，会让「payment 现在 QPS 多少？」被误判成故障排查（实测踩到）。
      - pattern: '(QPS|TPS|吞吐|延迟|耗时|错误率|失败率|超时|连接池|CPU|内存|磁盘|容量|水位|P99|P95|指标)[^，。；\n]{0,6}(有问题|是不是问题|是否正常|正常吗|异常|故障|挂了|不对劲)'
        weight: 0.8
        note: "指标/技术名词 + 异常措辞（如「QPS 最近有问题」）"
      - pattern: '突然|骤|暴涨|飙升|恶化|异常|变慢|变差|涨到|掉到'
        weight: 0.8
        note: "变化描述（『突然』『暴涨』）"

  # ---- R5 纯查询 -----------------------------------------------------
  - id: R5_metric
    intent: METRIC_QUERY
    gate: 0.50
    patterns:
      - pattern: 'QPS|TPS|吞吐|使用率|水位|容量|趋势|峰值|基线|平均值|分位'
        weight: 1.0
        note: "指标名词"
      - pattern: '多少|多大'
        weight: 0.6
        note: "问数值"
      - pattern: '查一下|看一下|现在|当前|实时'
        weight: 0.4
        note: "弱词：查询语气"

# ---- 兜底 ------------------------------------------------------------
#  ★ 分数必须低（0.20）：它是"规则层毫无线索"的强度值，要落在"不定案"那一侧，
#    好让模型级翻盘。改成 ≥0.60 就等于"对垃圾输入也直接定案"。
fallback:
  rule_id: R6_fallback
  score: 0.20
