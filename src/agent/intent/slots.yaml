# ==================================================================
#  槽位抽取的**数据表**（spec §7.1 的 `Slots`）
#
#  ★ 与 rules.yaml 同一条边界：**外置"词表/别名/正则"，不动"抽取逻辑"**。
#    这个文件里没有一行判断逻辑，只有"什么词算什么"。
#
#  ★ **服务清单不在这里**（重要）：
#    它是**部署事实**，由探测器动态问出来，落在 `src/agent/observed_info.yaml`
#    （AIOps 侧唯一来源）。本文件只保留**中文别名** —— 那是**语言数据**
#    （用户怎么说这些服务），不是部署事实，也不会随服务增减而变化。
#    校验器会强制：每个别名的目标都必须是 `observed_info.yaml` 里真实存在的服务。
#
#  ★ 改这个文件的三条约定：
#    1. `patterns.*` 里的正则**必须含名为 `value` 的捕获组**
#       （代码只认这个名字取值；校验器会拦，缺了就 fail-fast）；
#    2. `time.units` 的词序无所谓 —— 代码会**按词长降序**拼成正则，
#       保证「分钟」先于「分」匹配（这类"短词吃掉长词"的坑不用你操心）；
#    3. `defaults.time_window` 必须符合 `\d+(s|m|h|d)`（Slots 契约的校验规则）。
# ==================================================================

version: 1

# ---- 服务的中文别名（目标必须在 observed_info.yaml 里存在）--------------
aliases:
  网关: gateway
  订单: order
  支付: payment
  库存: inventory

# ---- 环境词（键必须落在 spec §7.1 的 {prod, staging, dev} 内）----------
envs:
  prod: [prod, 生产, 线上]
  staging: [staging, 预发, 灰度]
  dev: [dev, 开发, 测试]

# ---- 时间窗 ----------------------------------------------------------
time:
  cues: [最近, 过去, 近, 前, 这, 刚刚, 刚才, 以来, 以内, 之内]
  units:
    s: [秒钟, 秒]
    m: [分钟, 分]
    # ★ 「个小时」要排在「小时」前面 —— 不写也没关系，代码按长度降序拼正则，
    #   这里只是把两种说法都收进来
    h: [个小时, 小时, 钟头]
    d: [天]
  cn_digits: {一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10}

# ---- 症状（异常描述）词 ----------------------------------------------
# 症状 = "含这些词的分句"，所以这些词决定"哪句话会被当症状记下来"
anomaly_words:
  [延迟, 耗时, P99, P95, 错误率, 失败率, 超时, 报错, 失败, 不可用,
   雪崩, 抖动, 毛刺, 变慢, 变差, 异常, 涨, 跌, 掉,
   死锁, deadlock, DB_DEADLOCK, THREAD_POOL_REJECTED, 已满, 满了, 被拒绝,
   请求取消, 请求被取消, 连接断开, 客户端断开, 期限到达, 超过期限, 锁等待, 等锁,
   停机取消, 取消率, 取消次数, 超时率, 超时次数,
   cancellation, cancelled, canceled, disconnect, deadline, lock wait]

# ---- 实体类正则（必须含 `value` 命名组）-------------------------------
patterns:
  change_id: '(?:change[_-]?id|变更单|变更号|变更)\s*[:=#]?\s*(?P<value>[A-Za-z]{0,4}-?\d{2,}|[0-9a-f]{8,})'
  cluster: '(?:@|集群\s*[:=]\s*)(?P<value>[\w-]{2,})'
  namespace: '(?:命名空间|namespace|ns)\s*[:=]\s*(?P<value>[\w-]{2,})'
  slo: '(?:SLO|SLA|可用性|目标)\D{0,8}(?P<value>\d+(?:\.\d+)?\s*%)'

# ---- 默认值 ----------------------------------------------------------
#
#  ★ 时间窗是**真正的默认值**（用户没说时用它，同时记进 unresolved）。
#  ★★ T46a（用户 2026-10-02 指示）：默认从 **30m → 7d**。
#     理由（实测）：默认 30m 时，任何"有没有问题"的提问**只看最近半小时** ——
#     一条早上触发的故障，到下午问就必然"看不见"；用户把窗口调到 10h 也只是
#     把边界往前推一点（那 4 次 503 发生在窗口起点之前 → increase=0）。
#     用户原话："不再单独使用时间窗口查询，在输入没有明确时间范围的时候，
#     直接默认查询**最近的七天**记录"。
#     ★ **这是默认值唯一的来源**：`EMPTY_SLOTS` / 工具参数默认 / planner 兜底
#     都从这里取，不许再各写一份字面量（同一事实只留一份）。
#
#  ★ 集群名**故意不写**：它是**部署事实**，不是 Agent 该猜的东西。
#    取值走 `common/identity.py` 的阶梯（用户明说 → 被观测系统自报 → 环境变量 → 空）。
#    修前这里硬编码了 `compose-cn-1`：换个部署名就会让所有证据带上错误的集群标签，
#    而没有任何地方会报错（见 fix_bugs.md BUG-064 同族问题 / 决策记录 O6）。
defaults:
  time_window: 7d
  cluster: ""
